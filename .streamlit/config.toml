[server]
headless = true
maxUploadSize = 50          # MB; the API enforces the same default (SENTINEL_MAX_UPLOAD_MB)
enableXsrfProtection = true
address = "127.0.0.1"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2E"
textColor = "#E6EAF2"
borderColor = "#1E2A44"
font = "sans-serif"
