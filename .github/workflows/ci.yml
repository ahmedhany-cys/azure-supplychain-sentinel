# Continuous integration and supply-chain release gate.
#
# Security notes
# - Least privilege: the workflow token is read-only everywhere (`contents: read`).
# - `pull_request` (not `pull_request_target`): fork PRs run without secrets or write access.
# - Third-party actions are pinned to full commit SHAs (version noted in the comment).
# - Python dependencies are installed with `--require-hashes` from pip-compile lockfiles.
# - Tool binaries are pinned to exact versions; osv-scanner is checksum-verified.
# - Nothing is published or deployed from this workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly re-scan: new advisories appear without code changes
  workflow_dispatch:

permissions:
  contents: read

# Explicit `bash` gives `-eo pipefail`; the implicit default is only `bash -e`, which would
# let a failing command piped into `tee` pass unnoticed.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  SYFT_VERSION: v1.55.0
  OSV_SCANNER_VERSION: v2.7.0
  COSIGN_VERSION: v3.1.4
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt
      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff format --check .
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt
      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Install OSV-Scanner (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          mkdir -p "$RUNNER_TEMP/osv" && cd "$RUNNER_TEMP/osv"
          curl -fsSLO "$base/osv-scanner_linux_amd64"
          curl -fsSLO "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum --check
          install -m 0755 osv-scanner_linux_amd64 "$RUNNER_TEMP/osv/osv-scanner"
          echo "$RUNNER_TEMP/osv" >> "$GITHUB_PATH"
      - name: Put Syft on PATH
        run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          syft version | grep -i '^version'
          osv-scanner --version | head -1
          cosign version | grep -i gitversion
      - name: Unit, integration and regression tests
        run: |
          pytest --cov --cov-report=term --cov-report=xml:reports/coverage.xml \
                 --junitxml=reports/junit.xml
      - name: Demonstration scenarios produce their documented decisions
        run: sentinel demo --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-py${{ matrix.python }}
          path: reports/
          retention-days: 14

  supply-chain-gate:
    name: Supply-chain gate (self-scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/requirements-dev.txt
      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Install OSV-Scanner (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          mkdir -p "$RUNNER_TEMP/osv" && cd "$RUNNER_TEMP/osv"
          curl -fsSLO "$base/osv-scanner_linux_amd64"
          curl -fsSLO "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum --check
          install -m 0755 osv-scanner_linux_amd64 "$RUNNER_TEMP/osv/osv-scanner"
          echo "$RUNNER_TEMP/osv" >> "$GITHUB_PATH"
          echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"
      - name: SBOM for this project's locked runtime dependencies
        run: sentinel sbom requirements -o reports/sentinel-runtime.cdx.json
      - name: Release policy on this project's own dependencies (live OSV scan)
        # Exit codes: 0 PASS, 1 FAIL, 2 INDETERMINATE. Anything but PASS fails the job.
        run: sentinel scan requirements --out reports/self-scan --format md | tee "$GITHUB_STEP_SUMMARY"
      - name: Example release gate evidence (scenario 02)
        run: sentinel gate examples/02-clean-release/release.yaml --out reports/example-release-gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: supply-chain-evidence
          path: reports/
          retention-days: 30

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  terraform:
    name: Terraform validate (no credentials, no apply)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  container:
    name: Container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (not pushed)
        run: docker build --pull -t azure-supplychain-sentinel:ci .
      - name: Smoke test - CLI and demo regression inside the image
        run: |
          docker run --rm azure-supplychain-sentinel:ci sentinel --version
          docker run --rm azure-supplychain-sentinel:ci sentinel demo --check
